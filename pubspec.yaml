name: hidtool
description: 'A Flutter library for communicating with HID devices (Human Interface Device) using hidapi-0.15.0'
version: 0.1.0
homepage: https://github.com/hidtool/hidtool

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  ffigen: ^9.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: HidtoolPlugin
        dartPluginClass: HidLinux
      macos:
        pluginClass: HidtoolPlugin
        dartPluginClass: HidMacos
      windows:
        pluginClass: HidtoolPluginCApi
        dartPluginClass: HidWindows

